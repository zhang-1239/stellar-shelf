<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星槎书斋</title>
<meta name="description" content="一个人的书与星海">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/paper.css">
<link rel="stylesheet" href="/css/space.css">

</head>
<body data-mode="paper">
  <div id="app"></div>
  <div id="layer-modal"></div>
  <div id="layer-toast"></div>
  <script>
    // 诊断：把前端异常写进页面，便于排查
    window.__errs = [];
    function __report(msg) {
      window.__errs.push(msg);
      let box = document.getElementById('__diag');
      if (!box) { box = document.createElement('pre'); box.id = '__diag';
        box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9999;max-height:45vh;overflow:auto;margin:0;padding:10px;background:#300;color:#fcc;font:12px/1.5 monospace;white-space:pre-wrap';
        document.body.appendChild(box); }
      box.textContent = window.__errs.slice(-12).join('\n');
    }
    window.addEventListener('error', (e) => __report('[error] ' + (e.message || e.error) + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '')));
    window.addEventListener('unhandledrejection', (e) => __report('[reject] ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
